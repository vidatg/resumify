<!-- Hero Introduction Content (rendered inside shared-page-hero shell) -->
<div data-testid="hero.header" class="flex-1 flex flex-col justify-center items-center text-center px-8">
  <!-- Profile Card (White Background) -->
  <div class="bg-white rounded-3xl p-8 mb-8 shadow-xl border border-slate-100/50 w-full max-w-md flex flex-col items-center">
    <!-- Portrait -->
    <div class="w-48 h-48 rounded-full overflow-hidden border-4 border-indigo-100/50 ring-4 ring-indigo-50 ring-offset-4 ring-offset-white shadow-xl mb-8 transform hover:scale-[1.03] transition-transform duration-300">
      <img data-testid="hero.portrait" [src]="personalInfo.heroImage" [alt]="personalInfo.name + ' portrait'" class="w-full h-full object-cover">
    </div>

    <!-- Name & Title -->
    <h1 data-testid="hero.name" class="text-4xl font-extrabold tracking-tight text-primary mb-3">{{ personalInfo.name }}</h1>
    <h2 data-testid="hero.job-title" class="text-lg font-semibold text-accent tracking-wide mb-6">{{ personalInfo.jobTitle }}</h2>

    <!-- Decorative divider -->
    <div class="w-16 h-0.5 bg-indigo-200 rounded-full"></div>
  </div>

  <!-- Contact Details (driven by personalInfo.contacts) -->
  <div data-testid="hero.contact-grid" class="grid grid-cols-2 gap-4 text-sm text-slate-200 max-w-md w-full">
    <ng-container *ngFor="let contact of personalInfo.contacts">
      <a
        *ngIf="contact.href"
        [attr.data-testid]="'hero.' + contact.id"
        [href]="contact.href"
        [attr.target]="isExternal(contact.href) ? '_blank' : null"
        [attr.rel]="isExternal(contact.href) ? 'noopener' : null"
        class="flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20 px-4 py-3 rounded-xl text-slate-200 hover:text-white transition-all duration-200 cursor-pointer"
      >
        <ng-container [ngTemplateOutlet]="heroIcon" [ngTemplateOutletContext]="{ $implicit: iconOf(contact) }" />
        {{ contact.value }}
      </a>
      <div
        *ngIf="!contact.href"
        [attr.data-testid]="'hero.' + contact.id"
        class="flex items-center gap-2 bg-white/5 border border-white/10 px-4 py-3 rounded-xl"
      >
        <ng-container [ngTemplateOutlet]="heroIcon" [ngTemplateOutletContext]="{ $implicit: iconOf(contact) }" />
        {{ contact.value }}
      </div>
    </ng-container>
  </div>
</div>

<ng-template #heroIcon let-icon>
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-indigo-300 flex-shrink-0">
    <ng-container [ngSwitch]="icon">
      <path *ngSwitchCase="'phone'" stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
      <path *ngSwitchCase="'email'" stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.626a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
      <ng-container *ngSwitchCase="'location'">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
      </ng-container>
      <path *ngSwitchCase="'availability'" stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
      <path *ngSwitchCase="'website'" stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.778.099-1.533.284-2.253" />
      <path *ngSwitchCase="'linkedin'" stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
      <path *ngSwitchDefault stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
    </ng-container>
  </svg>
</ng-template>
