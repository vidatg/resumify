<header data-testid="resume-header" class="mb-0">
  <div class="flex items-center gap-4">
    <!-- Portrait -->
    <div data-testid="resume-header.portrait" class="w-16 h-16 rounded-full overflow-hidden border border-slate-300 flex-shrink-0">
      <img [src]="personalInfo.heroImage" [alt]="personalInfo.name + ' portrait'" class="w-full h-full object-cover grayscale contrast-125">
    </div>

    <!-- Name & Title -->
    <div class="flex-1">
      <h1 data-testid="resume-header.name" class="text-2xl font-extrabold text-primary leading-tight">{{ personalInfo.name }}</h1>
      <p data-testid="resume-header.job-title" class="text-sm font-semibold text-primary mt-0.5">{{ personalInfo.jobTitle }}</p>
      <p *ngIf="personalInfo.subtitle" data-testid="resume-header.subtitle" class="text-[11px] text-slate-600 leading-snug mt-0.5">{{ personalInfo.subtitle }}</p>
    </div>
  </div>

  <!-- Divider -->
  <div class="border-t border-slate-300 my-2"></div>

  <!-- Profile links, then direct contact -->
  <p data-testid="resume-header.contact" class="text-xs text-slate-600 leading-relaxed">
    <ng-container *ngFor="let contact of linkContacts; let last = last">
      <a
        *ngIf="contact.href"
        [attr.data-testid]="'resume-header.contact-' + contact.id"
        [href]="contact.href"
        [attr.target]="isExternal(contact.href) ? '_blank' : null"
        [attr.rel]="isExternal(contact.href) ? 'noopener' : null"
        class="text-accent hover:underline"
      >{{ contact.value }}</a>
      <span *ngIf="!contact.href" [attr.data-testid]="'resume-header.contact-' + contact.id">{{ contact.value }}</span>
      <span *ngIf="!last" class="mx-1.5 text-slate-300">|</span>
    </ng-container>
  </p>
  <p data-testid="resume-header.direct" class="text-xs text-slate-600 leading-relaxed mt-0.5">
    <ng-container *ngFor="let contact of directContacts; let last = last">
      <a
        *ngIf="contact.href"
        [attr.data-testid]="'resume-header.contact-' + contact.id"
        [href]="contact.href"
        class="text-slate-700 hover:underline"
      >{{ contact.value }}</a>
      <span *ngIf="!contact.href" [attr.data-testid]="'resume-header.contact-' + contact.id">{{ contact.value }}</span>
      <span *ngIf="!last" class="mx-1.5 text-slate-300">|</span>
    </ng-container>
  </p>
</header>
