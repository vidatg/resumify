<header data-testid="resume-header" class="mb-0">
  <div class="flex items-center gap-4">
    <!-- Portrait -->
    <div data-testid="resume-header.portrait" class="w-16 h-16 rounded-full overflow-hidden border-2 border-indigo-100 flex-shrink-0">
      <img [src]="personalInfo.heroImage" [alt]="personalInfo.name + ' portrait'" class="w-full h-full object-cover">
    </div>

    <!-- Name & Title -->
    <div class="flex-1">
      <h1 data-testid="resume-header.name" class="text-2xl font-extrabold text-primary leading-tight">{{ personalInfo.name }}</h1>
      <p data-testid="resume-header.job-title" class="text-sm text-slate-600 mt-0.5">{{ personalInfo.jobTitle }}</p>
    </div>
  </div>

  <!-- Divider -->
  <div class="border-t border-slate-300 my-2.5"></div>

  <!-- Contact line (driven by personalInfo.contacts) -->
  <p data-testid="resume-header.contact" class="text-xs text-slate-600 leading-relaxed">
    <ng-container *ngFor="let contact of personalInfo.contacts; let last = last">
      <a
        *ngIf="contact.href"
        [attr.data-testid]="'resume-header.contact-' + contact.id"
        [href]="contact.href"
        [attr.target]="isExternal(contact.href) ? '_blank' : null"
        [attr.rel]="isExternal(contact.href) ? 'noopener' : null"
        class="text-accent hover:underline"
      >{{ contact.value }}</a>
      <span
        *ngIf="!contact.href"
        [attr.data-testid]="'resume-header.contact-' + contact.id"
      >{{ contact.value }}</span>
      <span *ngIf="!last" class="mx-1.5">|</span>
    </ng-container>
  </p>
</header>
