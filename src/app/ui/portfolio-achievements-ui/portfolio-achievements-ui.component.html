<div class="resume-page">
    <!-- Running Header -->
    <div class="flex justify-between items-center text-[10px] uppercase tracking-wider text-slate-400 border-b border-slate-100 pb-2 mb-6">
      <span class="font-medium">Vida Taghiyar | Portfolio</span>
      <span class="font-bold text-slate-500">Recognitions & Achievements</span>
    </div>

    <!-- Highlighted Accomplishments Gallery -->
    <app-shared-section-heading-ui title="Highlighted Projects & Certifications" />
    <div data-testid="achievements.gallery" class="flex flex-col gap-4 mt-4">
      <div data-testid="achievements.gallery-item" *ngFor="let item of achievementItems" class="bg-white border border-slate-100 rounded-lg overflow-hidden shadow-sm flex flex-row h-[250px]">
        <!-- Image on Left -->
        <div class="relative w-[300px] h-full bg-slate-50 overflow-hidden flex-shrink-0">
          <img [src]="item.image" [alt]="item.title" class="w-full h-full object-cover">
        </div>
        <!-- Text Details on Right -->
        <div class="p-6 flex-1 flex flex-col justify-between">
          <div class="space-y-3">
            <h4 data-testid="achievements.gallery-item-title" class="text-base font-bold text-primary">{{ item.title }}</h4>
            <p class="text-xs text-slate-500 leading-relaxed font-light text-justify">{{ item.description }}</p>
          </div>
          <div class="mt-4">
            <a data-testid="achievements.gallery-item-link" [href]="item.link" target="_blank" class="text-xs font-bold text-accent hover:text-white bg-indigo-50/50 hover:bg-accent border border-indigo-100/80 hover:border-transparent px-3.5 py-2 rounded-md shadow-sm transition-all duration-200 flex items-center gap-1.5 w-fit">
              View Verification
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>

  <!-- Breathing space between content and footer -->
  <div class="flex-1 min-h-6"></div>

  <app-shared-page-footer-ui [pageConfig]="pageConfig" />
</div>
