<div class="resume-page !bg-primary !text-white">
  @if (title) {
    <!-- Simple divider mode: centered title + subtitle -->
    <div data-testid="divider.content" class="flex-1 flex flex-col justify-center items-center text-center px-12">
      <div data-testid="divider.accent" class="w-12 h-0.5 bg-white/30 rounded-full mb-8"></div>
      <h2 data-testid="divider.title" class="text-4xl font-extrabold tracking-tight mb-4">{{ title }}</h2>
      @if (subtitle) {
        <p data-testid="divider.subtitle" class="text-base font-light text-white/70 max-w-md leading-relaxed">{{ subtitle }}</p>
      }
      <div class="w-12 h-0.5 bg-white/30 rounded-full mt-8"></div>
    </div>
  } @else {
    <!-- Projection mode: render custom content -->
    <div class="flex-1 flex flex-col justify-center items-center">
      <ng-content />
    </div>
  }
  <app-shared-page-footer-ui [pageConfig]="pageConfig" theme="dark" />
</div>
