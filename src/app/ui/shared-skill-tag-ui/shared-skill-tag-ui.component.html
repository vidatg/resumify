<span
  data-testid="skill-tag.label"
  class="px-2 rounded border flex items-center gap-1 text-xs"
  [ngClass]="{
    'bg-indigo-50 text-indigo-700 border-indigo-100/50': variant !== 'ai',
    'bg-emerald-50 text-emerald-950 border-emerald-100': variant === 'ai',
    'font-medium py-1': variant === 'default' || variant === 'ai',
    'font-normal py-0.5': variant === 'compact'
  }"
>
  <span *ngIf="variant === 'ai'" data-testid="skill-tag.ai-indicator" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
  {{ label }}
</span>
